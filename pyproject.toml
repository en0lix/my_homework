[tool.poetry]
name = "pythonproject5"
version = "0.1.0"
description = "Banking operations processing"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [
    { include = "src" },
]

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.31.0"
python-dotenv = "^1.0.0"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
python-dateutil = "^2.8.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
pytest-cov = "^7.0.0"
mypy = "^1.10.0"
black = "^24.0.0"
isort = "^5.13.0"
flake8 = "^7.0.0"
types-requests = "^2.31.0"
types-python-dateutil = "^2.8.19"
pandas-stubs = "^2.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ===== pytest =====
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

# ===== coverage =====
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

# ===== black =====
[tool.black]
line-length = 100
target-version = ["py312"]

# ===== isort =====
[tool.isort]
profile = "black"
line_length = 100

# ===== mypy =====
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["tests/"]